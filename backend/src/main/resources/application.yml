spring:
  application:
    name: calculadora-gastos

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Lambda multiplica instancias concurrentes, cada una con su propio pool.
      # Un pool pequeño evita agotar el límite de conexiones de PostgreSQL.
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 30000
      max-lifetime: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
          batch_size: 20
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # En AWS se inyecta desde SSM Parameter Store.
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*}
  locale:
    zona-horaria: America/Bogota
    moneda: COP

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    root: INFO
    com.axchisan.gastos: INFO
    org.hibernate.SQL: WARN

---
# Perfil de desarrollo local: PostgreSQL en local, sin depender de Neon.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/gastos
    username: gastos
    password: gastos
  jpa:
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: clave-solo-para-desarrollo-local-no-usar-en-produccion-min-256-bits

logging:
  level:
    com.axchisan.gastos: DEBUG
    org.hibernate.SQL: DEBUG
