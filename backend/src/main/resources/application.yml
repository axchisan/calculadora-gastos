spring:
  application:
    name: calculadora-gastos

  autoconfigure:
    exclude:
      # La seguridad la define ConfiguracionSeguridad. Sin esta exclusión, Spring Boot crea
      # además un usuario en memoria con contraseña aleatoria y la escribe en el arranque, lo
      # que ensucia los registros y hace dudar de qué configuración está activa.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    # En AWS estos valores llegan desde SSM Parameter Store, que tiene mayor precedencia que
    # este fichero. Los valores por defecto vacíos evitan que el arranque falle por el
    # marcador sin resolver antes de que SSM aporte el suyo.
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      # Lambda multiplica instancias concurrentes, cada una con su propio pool.
      # Un pool pequeño evita agotar el límite de conexiones de PostgreSQL.
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 30000
      max-lifetime: 300000
      # Imprescindible con SnapStart: permite que Spring vacíe el pool antes de tomar el
      # snapshot y lo reabra al restaurarlo. Sin esto, la función revive con conexiones que ya
      # no existen al otro lado.
      allow-pool-suspension: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
          batch_size: 20
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    # En AWS se inyecta desde SSM Parameter Store.
    secret: ${JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-days: 30
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*}
  locale:
    zona-horaria: America/Bogota
    moneda: COP

springdoc:
  swagger-ui:
    path: /docs

logging:
  level:
    root: INFO
    com.axchisan.gastos: INFO
    org.hibernate.SQL: WARN

---
# Perfil de ejecución en AWS Lambda.
#
# La configuración sensible llega desde SSM Parameter Store; la importación se activa con la
# variable de entorno SPRING_CONFIG_IMPORT, que define Terraform, para que en local no se
# intente contactar con AWS.
spring:
  config:
    activate:
      on-profile: aws

  flyway:
    # Las migraciones se ejecutan durante la inicialización, que con SnapStart ocurre una sola
    # vez al publicar la versión y no en cada arranque en frío. Si alguna fallara, el
    # despliegue no llega a publicarse, que es el comportamiento deseado. Aun sin SnapStart
    # sería seguro: Flyway se serializa con un bloqueo consultivo de PostgreSQL.
    enabled: true

logging:
  level:
    root: WARN
    com.axchisan.gastos: INFO
  pattern:
    # CloudWatch ya añade su propia marca de tiempo a cada línea.
    console: "%-5level %logger{36} - %msg%n"

---
# Perfil de desarrollo local: PostgreSQL en local, sin depender de Neon.
spring:
  config:
    activate:
      on-profile: local

  # Desarrollar no debe exigir tener credenciales de AWS configuradas: sin estas exclusiones,
  # la autoconfiguración de Spring Cloud AWS intenta crear el cliente de SSM y el arranque
  # falla en cualquier máquina sin el CLI configurado.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.CredentialsProviderAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.RegionProviderAutoConfiguration
      - io.awspring.cloud.autoconfigure.config.parameterstore.ParameterStoreAutoConfiguration
      - io.awspring.cloud.autoconfigure.config.parameterstore.ParameterStoreReloadAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/gastos
    username: gastos
    password: gastos
  jpa:
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: clave-solo-para-desarrollo-local-no-usar-en-produccion-min-256-bits

logging:
  level:
    com.axchisan.gastos: DEBUG
    org.hibernate.SQL: DEBUG
