name: calculadora_gastos
description: "Calculadora de gastos mensuales: sueldo, gastos fijos, transporte, deudas y ahorro."
publish_to: 'none'

# El número tras el '+' es el código de versión de Android, que debe subir en cada publicación
# aunque el nombre de versión no cambie.
version: 1.2.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Comunicación con la API
  dio: ^5.7.0

  # Almacenamiento de los tokens en el sitio seguro de cada plataforma:
  # Keychain en macOS, Keystore en Android.
  flutter_secure_storage: ^9.2.2

  # Caché local del mes en curso, para poder consultarlo sin conexión y para que la primera
  # pantalla no espere al arranque en frío de Lambda.
  shared_preferences: ^2.3.3

  # Formato de moneda y fechas en español de Colombia.
  intl: ^0.19.0

  # Gráficas de distribución y evolución.
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Ejecuta pruebas sobre la aplicación real de cada plataforma. Es la única forma de
  # comprobar el almacén seguro, que depende del Keychain y del Keystore del sistema.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Genera los iconos de cada plataforma a partir de assets/icono/. Solo se usa al preparar una
  # publicación, con: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Configuración del generador de iconos. Las imágenes de partida las produce
# tools/generar_icono.py; no se editan a mano.
flutter_launcher_icons:
  image_path: "assets/icono/icono.png"

  android: true
  # Los lanzadores modernos recortan el icono con la forma que elija el usuario, así que el
  # primer plano se entrega con margen y el fondo como color plano.
  adaptive_icon_background: "#00695C"
  adaptive_icon_foreground: "assets/icono/icono_adaptativo.png"
  # Monocromo para los iconos con tema de Android 13 en adelante.
  adaptive_icon_monochrome: "assets/icono/icono_adaptativo.png"
  # El margen ya lo aplica tools/generar_icono.py, que puede medir el dibujo y ajustarlo al
  # círculo de recorte. El margen fijo del 16% que añade el generador lo dejaba demasiado
  # pequeño, así que aquí se anula.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23

  macos:
    generate: true
    image_path: "assets/icono/icono.png"

  web:
    generate: true
    image_path: "assets/icono/icono.png"
    background_color: "#00695C"
    theme_color: "#00695C"
