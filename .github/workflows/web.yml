name: Aplicación web

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

env:
  REGION: us-east-1

jobs:
  verificar:
    name: Análisis y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descargar dependencias
        working-directory: app
        run: flutter pub get

      - name: Comprobar el formato
        working-directory: app
        run: dart format --set-exit-if-changed .

      - name: Análisis estático
        working-directory: app
        run: flutter analyze

      - name: Pruebas
        working-directory: app
        run: flutter test

  desplegar:
    name: Publicar
    needs: verificar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # El token de OIDC solo se emite si el job lo pide explícitamente. Declararlo a nivel de
    # workflow no basta: sin este bloque, la asunción del rol falla con
    # "Not authorized to perform sts:AssumeRoleWithWebIdentity".
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Compilar para web
        working-directory: app
        run: |
          flutter build web --release \
            --dart-define=API_URL=${{ vars.API_URL }}

      - name: Obtener credenciales temporales
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Publicar en S3
        working-directory: app/build/web
        run: |
          # Flutter web NO pone hash en los nombres: main.dart.js, flutter.js y el resto se
          # llaman igual en cada compilación. Cachearlos como inmutables dejaba a CloudFront
          # sirviendo la versión anterior indefinidamente, incluso en incógnito y en
          # dispositivos nuevos, porque el caché es del CDN y no del navegador.
          #
          # Un único sync con --delete, para que no haya dos pasadas compitiendo por borrar
          # lo que la otra acaba de subir.
          aws s3 sync . "s3://${{ vars.BUCKET_WEB }}" --delete \
            --cache-control "no-cache,must-revalidate" \
            --only-show-errors

          # assets/ y canvaskit/ sí son estables entre compilaciones y pesan varios MB, así
          # que se les recoloca un caché largo sin volver a subirlos.
          aws s3 cp "s3://${{ vars.BUCKET_WEB }}/assets" "s3://${{ vars.BUCKET_WEB }}/assets" \
            --recursive --metadata-directive REPLACE \
            --cache-control "public,max-age=604800" --only-show-errors
          aws s3 cp "s3://${{ vars.BUCKET_WEB }}/canvaskit" "s3://${{ vars.BUCKET_WEB }}/canvaskit" \
            --recursive --metadata-directive REPLACE \
            --cache-control "public,max-age=604800" --only-show-errors

      - name: Vaciar el caché de CloudFront
        run: |
          # Se invalida todo: con archivos sin hash, cualquier ruta puede haber cambiado.
          # CloudFront incluye 1.000 invalidaciones al mes, muy por encima de este ritmo.
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.DISTRIBUCION_WEB }}" \
            --paths "/*" \
            --no-cli-pager > /dev/null
